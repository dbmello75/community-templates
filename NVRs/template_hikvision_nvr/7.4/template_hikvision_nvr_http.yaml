        - uuid: 2e7f3c0dc90d41aeb76502c985ce7134
          name: 'Camera {#CAM_ID}: Frame rate (max)'
          type: DEPENDENT
          key: hikvision_nvr.camera[{#CAM_ID}.max_frame_rate]
          value_type: FLOAT
          preprocessing:
          - type: JAVASCRIPT
            parameters:
            - "var data=JSON.parse(value), list=data.StreamingChannelList && data.StreamingChannelList.StreamingChannel;\nif (!list) { throw 'No stream\
              \ configuration'; }\nif (!Array.isArray(list)) { list=[list]; }\n// ISAPI main stream IDs: channel 1 -> 101, channel 2 -> 201.\nvar expected=Number('{#CAM_ID}')*100+1;\n\
              for (var n=0;n<list.length;n++) {\n    var stream=list[n];\n    if (Number(stream.id)!==expected) { continue; }\n    var raw=stream.Video\
              \ && stream.Video.maxFrameRate;\n    if (raw===undefined || raw===null || String(raw)==='' || !isFinite(Number(raw)) || Number(raw)<0)\
              \ { throw 'Missing frame rate'; }\n    return Number(raw)/100;\n}\nthrow 'Main stream not reported';"
            error_handler: DISCARD_VALUE
          master_item:
            key: hikvision_nvr.get_streaming
          tags:
          - tag: component
            value: camera
          units: '!fps'
          description: Configured main-stream FPS, not actual delivered FPS. ISAPI maxFrameRate is in hundredths of fps. Standard stream ID = channel
            ID * 100 + 1; unsupported mappings are discarded.

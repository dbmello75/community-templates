      - uuid: 7dbabaec74eb430692d2538bfad080c9
        name: Get device info
        type: SCRIPT
        key: hikvision_nvr.get_info
        history: '0'
        value_type: TEXT
        description: Used to get the device information
        tags:
        - tag: component
          value: raw
        delay: 1m
        timeout: 10s
        params: "var p = JSON.parse(value), result = {}, request = new HttpRequest();\nrequest.setHttpAuth(HTTPAUTH_DIGEST, p.user, p.password);\nvar\
          \ started = Date.now();\ntry {\n    var body = request.get(p.url), code = request.getStatus();\n    var observed = (started + Date.now())\
          \ / 2;\n    if (code === 401 || code === 403) {\n        return JSON.stringify({_health: 1, _http: code});\n    }\n    if (code !== 200) {\n\
          \        return JSON.stringify({_health: 2, _http: code});\n    }\n    result = JSON.parse(XML.toJson(body));\n    if (!result[p.root] ||\
          \ typeof result[p.root] !== 'object') {\n        return JSON.stringify({_health: 2, _http: code});\n    }\n    result._health = 0;\n    result._http\
          \ = code;\n    result._observed = observed;\n} catch (e) {\n    // Do not return response bodies or exception text containing credentials.\n\
          \    return JSON.stringify({_health: 2, _http: 0});\n}\nreturn JSON.stringify(result);"
        parameters:
        - name: url
          value: http://{$HIKVISION_ISAPI_HOST}:{$HIKVISION_ISAPI_PORT}/ISAPI/System/deviceInfo
        - name: root
          value: DeviceInfo
        - name: user
          value: '{$USER}'
        - name: password
          value: '{$PASSWORD}'
        preprocessing:
        - type: CHECK_NOT_SUPPORTED
          parameters:
          - '-1'
          error_handler: CUSTOM_VALUE
          error_handler_params: '{"_health":2,"_http":0}'
      - uuid: c1fd75600fd94884b4e3bd70327fee7d

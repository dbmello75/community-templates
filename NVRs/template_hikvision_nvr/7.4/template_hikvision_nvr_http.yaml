            '
          name: 'Hikvision: Camera {#CAM_ID} is offline'
          event_name: 'Hikvision: Camera {#CAM_ID} is offline. Check status.'
          priority: HIGH
          description: SMART status of HDD is not normal.
          tags:
          - tag: scope
            value: high
        url: http://{$HIKVISION_ISAPI_HOST}:{$HIKVISION_ISAPI_PORT}/ISAPI/ContentMgmt/InputProxy/channels
        status_codes: 200,401
        preprocessing:
        - type: XML_TO_JSON
        - type: JAVASCRIPT
          parameters:
          - "var data=JSON.parse(value);\nif (!data.InputProxyChannelList) { throw 'Missing channel list'; }\nvar channels=data.InputProxyChannelList.InputProxyChannel\
            \ || [];\nif (!Array.isArray(channels)) { channels=[channels]; }\nvar out=[];\nchannels.forEach(function(cam) {\n    if (!cam || !/^\\d+$/.test(String(cam.id)))\
            \ { return; }\n    var desc=cam.sourceInputPortDescriptor || {};\n    out.push({\"{#CAM_ID}\":String(cam.id), \"{#CAM_NAME}\":String(cam.name\
            \ || ''),\n        \"{#CAM_IP}\":String(desc.ipAddress || ''), \"{#CAM_PORT}\":String(desc.managePortNo || ''),\n        \"{#CAM_PROT}\"\
            :String(desc.proxyProtocol || '')});\n});\nreturn JSON.stringify(out);"
